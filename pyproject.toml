[project]
name = "publicador-tiras"
version = "0.1.0"
description = "Publicador semiautomático de tiras de publicidad en grupos de Facebook"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
