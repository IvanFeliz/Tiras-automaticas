<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Grupo falso</title>
<body>
<div role="button" tabindex="0" id="abrir">Escribe algo...</div>
<script>
// ?sin_permiso=1: la cuenta no puede publicar en este grupo (no hay «Escribe algo…»).
if (location.search.includes('sin_permiso=1')) {
  document.getElementById('abrir').remove();
  document.body.insertAdjacentHTML('beforeend', '<p>Solo los miembros aprobados pueden publicar.</p>');
}
</script>
<script>
// Imita el compositor de Facebook: diálogo con contenteditable (maneja 'paste' como Lexical),
// input de archivos y botón Publicar que cierra el diálogo.
// ?aviso_previo=1: un aviso viejo ya visible en la página antes de publicar.
if (location.search.includes('aviso_previo=1')) {
  const a = document.createElement('div'); a.setAttribute('role', 'alert');
  a.innerText = 'Error de conexión: se recuperó'; document.body.appendChild(a);
}
document.getElementById('abrir').addEventListener('click', () => {
  const d = document.createElement('div');
  d.setAttribute('role', 'dialog');
  d.innerHTML = `
    <h2>Crear publicación</h2>
    <div id="vista"><div contenteditable="true" role="textbox" id="ed"></div></div>
    <div role="button" tabindex="0" id="editar-foto">Editar foto</div>
    <input type="file" multiple accept="image/*,video/*" id="archivos">
    <div id="previas"></div>
    <div role="button" aria-label="Publicar" aria-disabled="true" tabindex="-1" id="publicar-desactivado"><span>Publicar</span></div>
    <div role="button" aria-label="Publicar" tabindex="0" id="publicar"><span>Publicar</span></div>`;
  document.body.appendChild(d);
  const ed = d.querySelector('#ed');
  // ?borrador=1: Facebook recuerda un borrador al reabrir.
  if (location.search.includes('borrador=1')) ed.innerText = 'texto viejo del borrador';
  // Cambio de vista: el editor desaparece (como la edición de foto de Facebook).
  d.querySelector('#editar-foto').addEventListener('click', () => { d.querySelector('#vista').remove(); });
  // ?barra_oculta=1: un spinner oculto que Facebook deja en la página.
  if (location.search.includes('barra_oculta=1')) {
    const b = document.createElement('div'); b.setAttribute('role', 'progressbar'); b.style.display = 'none'; d.appendChild(b);
  }
  ed.addEventListener('paste', (e) => {
    e.preventDefault();
    const t = e.clipboardData.getData('text/plain');
    // ?lento=1 imita a Lexical: el pegado se aplica después, no al instante.
    // Se agrega al final (como el cursor de Facebook); un editor "vacío" con solo saltos cuenta como vacío.
    const pegar = () => { ed.innerText = (ed.innerText.trim() ? ed.innerText : '') + t; };
    if (location.search.includes('lento=1')) setTimeout(pegar, 100);
    else pegar();
  });
  d.querySelector('#archivos').addEventListener('change', (e) => {
    const p = d.querySelector('#previas');
    const bar = document.createElement('div');
    bar.setAttribute('role', 'progressbar');
    p.appendChild(bar);
    const espera = location.search.includes('subida_lenta=1') ? 60000 : 300;
    setTimeout(() => {
      bar.remove();
      window.__subidos = Array.from(e.target.files).map(f => f.name);
    }, espera);
  });
  d.querySelector('#publicar').addEventListener('click', () => {
    window.__textoPublicado = ed.innerText;
    d.remove();
    if (location.search.includes('bloqueo_al_publicar=1')) {
      document.body.insertAdjacentHTML('beforeend',
        '<div role="dialog"><h2>Tu cuenta está restringida</h2><p>No puedes publicar durante 3 días.</p></div>');
    }
    if (location.search.includes('falla=1')) {
      const a = document.createElement('div');
      a.setAttribute('role', 'alert');
      a.innerText = 'No se pudo publicar. Intenta de nuevo más tarde.';
      setTimeout(() => document.body.appendChild(a), 300);
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') d.remove(); });
});
</script>
</body></html>
