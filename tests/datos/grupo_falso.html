<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Grupo falso</title>
<body>
<div role="button" tabindex="0" id="abrir">Escribe algo...</div>
<script>
// Imita el compositor de Facebook: diálogo con contenteditable (maneja 'paste' como Lexical),
// input de archivos y botón Publicar que cierra el diálogo.
document.getElementById('abrir').addEventListener('click', () => {
  const d = document.createElement('div');
  d.setAttribute('role', 'dialog');
  d.innerHTML = `
    <h2>Crear publicación</h2>
    <div contenteditable="true" role="textbox" id="ed"></div>
    <input type="file" multiple accept="image/*,video/*" id="archivos">
    <div id="previas"></div>
    <div role="button" aria-label="Publicar" aria-disabled="true" tabindex="-1" id="publicar-desactivado"><span>Publicar</span></div>
    <div role="button" aria-label="Publicar" tabindex="0" id="publicar"><span>Publicar</span></div>`;
  document.body.appendChild(d);
  const ed = d.querySelector('#ed');
  ed.addEventListener('paste', (e) => {
    e.preventDefault();
    const t = e.clipboardData.getData('text/plain');
    // ?lento=1 imita a Lexical: el pegado se aplica después, no al instante.
    if (location.search.includes('lento=1')) setTimeout(() => { ed.innerText += t; }, 100);
    else ed.innerText = t;
  });
  d.querySelector('#archivos').addEventListener('change', (e) => {
    const p = d.querySelector('#previas');
    const bar = document.createElement('div');
    bar.setAttribute('role', 'progressbar');
    p.appendChild(bar);
    setTimeout(() => {
      bar.remove();
      window.__subidos = Array.from(e.target.files).map(f => f.name);
    }, 300);
  });
  d.querySelector('#publicar').addEventListener('click', () => {
    window.__textoPublicado = ed.innerText;
    d.remove();
    if (location.search.includes('falla=1')) {
      const a = document.createElement('div');
      a.setAttribute('role', 'alert');
      a.innerText = 'No se pudo publicar. Intenta de nuevo más tarde.';
      setTimeout(() => document.body.appendChild(a), 300);
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') d.remove(); });
});
</script>
</body></html>
