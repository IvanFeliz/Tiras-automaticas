name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyinstaller
          python -m playwright install chromium

      - name: Pruebas
        run: pytest -v

      # Carpeta (onedir) en vez de un solo .exe: abre más rápido y el antivirus la bloquea menos.
      - name: Generar PublicadorTiras
        run: |
          pyinstaller --onedir --windowed --name PublicadorTiras --paths src src/publicador/__main__.py
          Copy-Item LEEME.md dist/PublicadorTiras/LEEME.md

      - uses: actions/upload-artifact@v5
        with:
          name: PublicadorTiras
          path: dist/PublicadorTiras/
