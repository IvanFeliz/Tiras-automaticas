name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # para publicar la versión descargable en Releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyinstaller
          python -m playwright install chromium

      - name: Pruebas
        run: pytest -v -rs

      # Carpeta (onedir) en vez de un solo .exe: abre más rápido y el antivirus la bloquea menos.
      - name: Generar PublicadorTiras
        run: |
          pyinstaller --onedir --windowed --name PublicadorTiras --paths src --icon src/publicador/recursos/logo.ico --add-data "src/publicador/recursos;publicador/recursos" src/publicador/__main__.py
          Copy-Item LEEME.md dist/PublicadorTiras/LEEME.md

      - uses: actions/upload-artifact@v5
        with:
          name: PublicadorTiras
          path: dist/PublicadorTiras/

      # En main: se publica en Releases con link fijo de descarga.
      - name: Publicar versión descargable
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/PublicadorTiras -DestinationPath PublicadorTiras.zip
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag PublicadorTiras.zip --repo ${{ github.repository }} --target ${{ github.sha }} --title "Publicador de Tiras $tag" --notes "Descarga PublicadorTiras.zip, descomprímelo (clic derecho, Extraer todo) y abre PublicadorTiras.exe dentro de la carpeta." --latest
